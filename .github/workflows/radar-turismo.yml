name: Publicar Radar e atualizar monitores
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * 11 *'
    - cron: '0 12 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar monitor
        run: python -m unittest discover -s radar/turismo -p 'test_*.py'
      - name: Testar taxas de financiamento
        run: python -m unittest discover -s radar/financiamento -p 'test_*.py'
      - name: Consultar campanhas de 2026
        if: github.event_name != 'push'
        run: python radar/turismo/monitor.py
      - name: Consultar taxas do Banco Central diariamente
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 12 * * *'
        run: python radar/financiamento/monitor.py
      - name: Guardar histórico
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar/turismo/data.json radar/financiamento/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar consultas de Turismo e financiamento'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
